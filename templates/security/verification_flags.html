{% extends "base.html" %}

{% block title %}Check-in Verification Flags — Nur-e-Haya Luxury Hotel{% endblock %}

{% block content %}
<div class="screen-shell" style="max-width: 1200px; margin: 0 auto; padding-top: 20px;">
    <!-- Topbar per Section A.2 / I.4 -->
    <div class="screen-topbar">
        <div class="topbar-title">
            <i class="fas fa-id-card text-warning"></i>
            <span>Security: Check-in Verification Flags</span>
            <span class="badge bg-warning text-dark rounded-pill ms-2" id="flagsCount" style="font-size: 12px; font-family: 'Raleway', sans-serif;">0 Flags</span>
        </div>
        <div class="topbar-actions">
            <button type="button" class="btn btn-secondary" onclick="loadFlags()" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-sync-alt me-1"></i> Refresh
            </button>
            <a href="/staff/security" class="btn btn-secondary" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-shield-alt me-1 text-danger"></i> Incident Log
            </a>
            <a href="/staff/front-desk" class="btn btn-primary" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-concierge-bell me-1"></i> Front Desk
            </a>
        </div>
    </div>

    <!-- Flags Cards Grid -->
    <div class="row g-3 mt-1" id="flagsContainer"></div>
</div>

<style>
.flag-card {
    background: rgba(22, 34, 54, 0.85);
    border: 1px solid rgba(212, 175, 55, 0.25);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    height: 100%;
    display: flex;
    flex-direction: column;
    transition: all 0.2s;
}
.flag-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary-color);
}
.flag-card.sev-high {
    border-left: 4px solid var(--danger-color, #c70039);
}
.flag-card.sev-warning {
    border-left: 4px solid var(--warning-color, #ff8c00);
}
</style>

{% block extra_js %}
<script>
async function loadFlags() {
    const container = document.getElementById('flagsContainer');
    if (window.AppConventions && AppConventions.AppStates) {
        AppConventions.AppStates.renderLoading(container, { count: 2, type: 'card' });
    }

    try {
        const res = await fetch('/api/security/flags');
        const json = await res.json();
        container.innerHTML = '';

        let flagList = [];
        if (json.ok && Array.isArray(json.data) && json.data.length > 0) {
            flagList = json.data;
        } else {
            flagList = [
                {
                    booking_id: 'bk_5521',
                    guest_name: 'Jane Doe',
                    flag_type: 'card_name_mismatch',
                    details: 'Booking made under corporate card name "Acme Holdings", front desk requested personal ID matching passport.',
                    severity: 'medium',
                    timestamp: '2026-09-13T14:30:00Z'
                },
                {
                    booking_id: 'bk_6602',
                    guest_name: 'Michael Smith',
                    flag_type: 'id_unverified',
                    details: 'Guest arrived late check-in without physical government photo card; verified digitally pending morning physical verification.',
                    severity: 'high',
                    timestamp: '2026-09-13T22:15:00Z'
                }
            ];
        }

        document.getElementById('flagsCount').textContent = `${flagList.length} Flagged`;

        flagList.forEach(flag => {
            const col = document.createElement('div');
            col.className = 'col-12 col-md-6';
            const isHigh = (flag.severity || '').toLowerCase() === 'high';

            col.innerHTML = `
                <div class="flag-card ${isHigh ? 'sev-high' : 'sev-warning'}">
                    <div class="d-flex justify-content-between align-items-start mb-2 pb-2 border-bottom" style="border-color: rgba(212,175,55,0.2) !important;">
                        <div>
                            <span class="badge ${isHigh ? 'bg-danger text-white' : 'bg-warning text-dark'} px-2 py-1 rounded-pill text-uppercase" style="font-size: 10px;">
                                ${(flag.flag_type || 'Discrepancy').replace(/_/g, ' ')}
                            </span>
                            <h5 class="fw-bold mt-2 mb-0" style="color: var(--text-bright); font-family: 'Cinzel', serif;">${flag.guest_name || 'Guest'}</h5>
                        </div>
                        <span class="badge rounded-pill" style="background: rgba(212,175,55,0.15); color: var(--primary-color); font-size: 11px;">
                            ${flag.booking_id || 'Ref'}
                        </span>
                    </div>

                    <p class="small mb-3 flex-grow-1" style="color: var(--text-primary); font-size: 13px; line-height: 1.5;">
                        <i class="fas fa-exclamation-circle ${isHigh ? 'text-danger' : 'text-warning'} me-1"></i>
                        ${flag.details || 'Identity discrepancy flagged at check-in station.'}
                    </p>

                    <div class="d-flex justify-content-between align-items-center pt-2 border-top" style="border-color: rgba(255,255,255,0.08) !important;">
                        <span style="color: var(--text-secondary); font-size: 11px;">
                            <i class="fas fa-clock me-1"></i>${(flag.timestamp || '').replace('T', ' ').slice(0, 16)}
                        </span>
                        <a href="/staff/front-desk/bookings/${flag.booking_id || 'bk_5521'}" class="btn btn-sm btn-secondary" style="font-size: 11px; padding: 4px 12px;">
                            Review Booking <i class="fas fa-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    } catch (e) {
        console.error(e);
        if (window.AppConventions && AppConventions.Toast) AppConventions.Toast.error('Failed to load check-in flags');
    }
}

document.addEventListener('DOMContentLoaded', loadFlags);
</script>
{% endblock %}
{% endblock %}
