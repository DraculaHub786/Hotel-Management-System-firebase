{% extends "base.html" %}

{% block title %}Front Desk — Today's Arrivals & Departures — Nur-e-Haya{% endblock %}

{% block content %}
<div class="screen-shell" style="max-width: 1400px; margin: 0 auto;">
    <!-- Topbar per Section A.2 -->
    <div class="screen-topbar">
        <div class="topbar-title">
            <i class="fas fa-concierge-bell text-warning"></i> Front Desk: Arrivals & Departures
        </div>
        <div class="topbar-actions">
            <a href="/frontdesk/checkin" class="btn btn-secondary" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-key"></i> Guest Check-In
            </a>
            <a href="/staff/front-desk/rooms" class="btn btn-secondary" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-th"></i> Room Board
            </a>
            <button type="button" class="btn btn-primary" onclick="openDirectCheckinModal()" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-plus"></i> Quick Check-in
            </button>
        </div>
    </div>

    <!-- Filterbar per Section A.2 -->
    <div class="screen-filterbar" style="margin-top: 15px;">
        <span style="font-size: 13px; color: var(--text-secondary); font-family: 'Cinzel', serif;">Queue:</span>
        <div class="filter-pills" id="deskQueuePills">
            <button type="button" class="filter-pill active" data-queue="arrivals">Today's Arrivals ({{ arrivals|length }})</button>
            <button type="button" class="filter-pill" data-queue="departures">Today's Departures ({{ departures|length }})</button>
            <button type="button" class="filter-pill" data-queue="in_house">Currently In-House ({{ in_house|length }})</button>
        </div>
    </div>

    <!-- Queue Table -->
    <div id="deskQueueArea" style="margin-top: 25px;">
        <!-- Injected via JS -->
    </div>
</div>

<!-- Modal: Quick Check-in per Section D.3 -->
<div class="app-modal-overlay" id="quickCheckinModal">
    <div class="app-modal-card" style="max-width: 500px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 10px;">
            <h3 style="font-size: 18px; color: var(--text-bright); margin: 0;"><i class="fas fa-key text-warning me-2"></i>Guest Check-In</h3>
            <button type="button" onclick="closeCheckinModal()" style="background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer;">&times;</button>
        </div>

        <form id="frontDeskCheckinForm" novalidate>
            <!-- Booking Ref typeahead -->
            <div class="form-group">
                <label class="form-label required" for="modalBookingId">Booking Reference / ID</label>
                <input type="text" id="modalBookingId" name="booking_id" class="form-control" placeholder="e.g. BK1726354890 or doc ID" required>
                <div class="form-field-error" data-for="booking_id"></div>
            </div>

            <!-- Room assignment dropdown -->
            <div class="form-group">
                <label class="form-label required" for="modalRoomId">Assign Room</label>
                <input type="text" id="modalRoomId" name="room_id" class="form-control" placeholder="e.g. 101, 102, 204" value="101" required>
                <div class="form-field-error" data-for="room_id"></div>
            </div>

            <!-- ID verification confirmed checkbox -->
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 10px; color: var(--text-primary); font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="modalIdVerified" name="id_verified" checked required>
                    <span><strong>Government Photo ID</strong> inspected and verified</span>
                </label>
                <div class="form-field-error" data-for="id_verified"></div>
            </div>

            <!-- Notes -->
            <div class="form-group">
                <label class="form-label" for="modalNotes">Check-in Notes</label>
                <textarea id="modalNotes" name="notes" class="form-control" rows="2" placeholder="Keycards issued, baggage assistance requested..."></textarea>
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
                <button type="button" class="btn btn-secondary" onclick="closeCheckinModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="btnConfirmCheckin">Confirm Check-in</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentQueue = 'arrivals';
const area = document.getElementById('deskQueueArea');
const modal = document.getElementById('quickCheckinModal');

const serverData = {
    arrivals: {{ arrivals|tojson|safe if arrivals else '[]' }},
    departures: {{ departures|tojson|safe if departures else '[]' }},
    in_house: {{ in_house|tojson|safe if in_house else '[]' }}
};

function renderQueue(type) {
    const list = serverData[type] || [];
    if (list.length === 0) {
        if (window.AppStates && AppStates.renderEmpty) {
            AppStates.renderEmpty(area, {
                icon: 'fa-calendar-check',
                title: 'Queue Clear',
                message: `No ${type.replace('_', ' ')} scheduled for today.`
            });
        } else {
            area.innerHTML = `
                <div class="card p-5 text-center text-secondary">
                    <i class="fas fa-calendar-check fa-2x mb-3 text-warning"></i>
                    <h5 class="text-white">Queue Clear</h5>
                    <p class="small mb-0">No ${type.replace('_', ' ')} currently listed.</p>
                </div>
            `;
        }
        return;
    }

    const rows = list.map(item => {
        const id = item.id || item.booking_no || 'N/A';
        const bno = item.booking_no || item.id || 'N/A';
        const guest = item.guest_name || item.user_email || 'Guest';
        const room = item.room_number ? `Room ${item.room_number}` : (item.room || '101');
        const rnum = item.room_number || (item.room ? item.room.replace('Room ', '') : '101');
        const cin = (item.check_in || '').slice(0, 10);
        const cout = (item.check_out || '').slice(0, 10);
        const dates = (cin && cout) ? `${cin} → ${cout}` : (item.dates || 'In Stay');
        const notes = item.special_requests || item.notes || item.checkin_notes || '—';
        const status = item.status || 'confirmed';

        return `
            <tr>
                <td>
                    <strong style="color: var(--primary-color); font-family: monospace;">${bno}</strong>
                </td>
                <td>
                    <strong style="color: var(--text-bright);">${guest}</strong>
                </td>
                <td><span class="badge bg-secondary text-warning">${room}</span></td>
                <td style="font-size: 13px; color: var(--text-secondary);">${dates}</td>
                <td style="font-size: 12px; color: var(--text-primary); font-style: italic;">${notes}</td>
                <td style="text-align: right;">
                    ${type === 'arrivals' ? (status !== 'checked_in' ? `
                        <button type="button" class="btn btn-primary" onclick="openDirectCheckinModal('${id}', '${rnum}')" style="font-size: 11px; padding: 5px 12px;">
                            <i class="fas fa-key me-1"></i> Check-in
                        </button>
                    ` : `<span class="badge bg-success py-1 px-2"><i class="fas fa-check me-1"></i>In House</span>`) : `
                        <button type="button" class="btn btn-danger" onclick="triggerCheckout('${id}')" style="font-size: 11px; padding: 5px 12px;">
                            <i class="fas fa-sign-out-alt me-1"></i> Check-out
                        </button>
                    `}
                </td>
            </tr>
        `;
    }).join('');

    area.innerHTML = `
        <div class="screen-content">
            <table class="app-table">
                <thead>
                    <tr>
                        <th>Booking Ref</th>
                        <th>Guest Name</th>
                        <th>Assigned Room</th>
                        <th>Stay Window</th>
                        <th>Notes / Requests</th>
                        <th style="text-align: right;">Front Desk Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                </tbody>
            </table>
        </div>
    `;
}

window.openDirectCheckinModal = (bkId = '', room = '') => {
    modal.classList.add('active');
    if (bkId) document.getElementById('modalBookingId').value = bkId;
    if (room) document.getElementById('modalRoomId').value = room;
};

window.closeCheckinModal = () => {
    modal.classList.remove('active');
};

window.triggerCheckout = async (bookingId) => {
    if (!confirm(`Confirm check-out for booking ${bookingId}? This will mark room for cleaning and generate turnover task.`)) return;

    try {
        const res = await (window.AppAPI ? AppAPI.post('/api/front-desk/checkout', { booking_id: bookingId }) :
            fetch('/api/front-desk/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ booking_id: bookingId })
            }).then(r => r.json()));

        if (window.Toast) Toast.success('Check-out completed successfully! Housekeeping notified.');
        else if (window.showToast) window.showToast('Check-out completed successfully!', 'success');
        setTimeout(() => location.reload(), 1200);
    } catch (e) {
        if (window.Toast) Toast.error(e.message || 'Check-out failed');
        else alert(e.message || 'Check-out failed');
    }
};

document.addEventListener('DOMContentLoaded', () => {
    renderQueue('arrivals');

    document.querySelectorAll('#deskQueuePills .filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            document.querySelectorAll('#deskQueuePills .filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            currentQueue = pill.dataset.queue;
            renderQueue(currentQueue);
        });
    });

    const form = document.getElementById('frontDeskCheckinForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const bookingId = document.getElementById('modalBookingId').value.trim();
        const roomId = document.getElementById('modalRoomId').value.trim();
        const notes = document.getElementById('modalNotes').value.trim();

        try {
            const res = await (window.AppAPI ? AppAPI.post('/api/front-desk/checkin', {
                booking_id: bookingId,
                room_number: roomId,
                notes: notes
            }) : fetch('/api/front-desk/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ booking_id: bookingId, room_number: roomId, notes: notes })
            }).then(r => r.json()));

            if (window.Toast) Toast.success(`Guest checked in to Room ${roomId}! Keycards active.`);
            else if (window.showToast) window.showToast(`Guest checked in to Room ${roomId}!`, 'success');
            closeCheckinModal();
            setTimeout(() => location.reload(), 1200);
        } catch (err) {
            if (window.Toast) Toast.error(err.message || 'Check-in failed');
            else alert(err.message || 'Check-in failed');
        }
    });
});
</script>
{% endblock %}
