{% extends "base.html" %}

{% block title %}Room Status Board — Front Desk — Nur-e-Haya{% endblock %}

{% block extra_css %}
<style>
    .status-badge-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
    }

    .room-card-status {
        background: var(--glass-bg, rgba(22, 34, 54, 0.85));
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 12px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
    }

    .room-card-status:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    /* Section D.2 Status Color Coding */
    .status-available {
        border-top: 4px solid #34a853; /* green */
    }
    .status-occupied {
        border-top: 4px solid #4285f4; /* blue */
    }
    .status-cleaning, .status-dirty {
        border-top: 4px solid #fbbc05; /* yellow */
    }
    .status-in_progress {
        border-top: 4px solid #ff8c00; /* orange */
    }
    .status-maintenance, .status-blocked {
        border-top: 4px solid #ea4335; /* red */
    }

    /* Side Drawer for Room Detail per Section D.2 */
    .side-drawer-overlay {
        position: fixed;
        top: 0;
        right: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .side-drawer-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .side-drawer {
        position: absolute;
        top: 0;
        right: 0;
        width: 440px;
        max-width: 90vw;
        height: 100%;
        background: #162236;
        border-left: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: -10px 0 40px rgba(0, 0, 0, 0.7);
        padding: 30px;
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .side-drawer-overlay.active .side-drawer {
        transform: translateX(0);
    }
</style>
{% endblock %}

{% block content %}
<div class="screen-shell" style="max-width: 1400px; margin: 0 auto; padding-top: 24px; padding-bottom: 60px;">
    <!-- Topbar -->
    <div class="screen-topbar">
        <div class="topbar-title">
            <i class="fas fa-th-large text-warning"></i> Live Room Status Board
        </div>
        <div class="topbar-actions">
            <a href="/frontdesk/tape-chart" class="btn btn-gold" style="font-size: 12px; padding: 8px 16px; margin-right: 8px;">
                <i class="fas fa-calendar-alt me-1"></i> Tape Chart Matrix
            </a>
            <a href="/staff/front-desk" class="btn btn-secondary-glass" style="font-size: 12px; padding: 8px 16px;">
                <i class="fas fa-list me-1"></i> Arrivals / Departures
            </a>
        </div>
    </div>

    <!-- Filterbar per Section D.2: Floor selector & status filter chips -->
    <div class="screen-filterbar" style="margin-top: 15px; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 13px; color: var(--text-secondary); font-family: 'Cinzel', serif;">Floor:</span>
                <select id="floorSelector" class="form-control" style="width: 130px; padding: 6px 12px; font-size: 12px; border-radius: 8px;">
                    <option value="all">All Floors</option>
                    <option value="1">Floor 1</option>
                    <option value="2">Floor 2</option>
                    <option value="3">Floor 3</option>
                </select>
            </div>

            <div class="filter-pills" id="statusFilterPills">
                <button type="button" class="filter-pill active" data-status="all">All</button>
                <button type="button" class="filter-pill" data-status="available"><span class="status-badge-indicator" style="background: #34a853; margin-right: 4px;"></span> Available</button>
                <button type="button" class="filter-pill" data-status="occupied"><span class="status-badge-indicator" style="background: #4285f4; margin-right: 4px;"></span> Occupied</button>
                <button type="button" class="filter-pill" data-status="cleaning"><span class="status-badge-indicator" style="background: #fbbc05; margin-right: 4px;"></span> Dirty / Cleaning</button>
                <button type="button" class="filter-pill" data-status="maintenance"><span class="status-badge-indicator" style="background: #ea4335; margin-right: 4px;"></span> Maintenance</button>
            </div>
        </div>
    </div>

    <!-- Room Grid -->
    <div id="roomGridContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 25px;">
        <!-- Injected via JS -->
    </div>
</div>

<!-- Side Drawer for Room Detail per Section D.2 -->
<div class="side-drawer-overlay" id="roomSideDrawer">
    <div class="side-drawer" id="drawerContent">
        <!-- Injected on card click -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let roomsData = [];
const grid = document.getElementById('roomGridContainer');
const drawerOverlay = document.getElementById('roomSideDrawer');
const drawerContent = document.getElementById('drawerContent');

async function loadRooms() {
    AppStates.renderLoading(grid, { type: 'card', count: 6 });
    try {
        const res = await AppAPI.get('/api/front-desk/room-board');
        roomsData = res || [];
        renderBoard(roomsData);
    } catch (e) {
        // Fallback demo rooms
        roomsData = [
            { id: '1', number: '101', floor: 1, type: 'Single', status: 'available', price: 2500, guest: null },
            { id: '2', number: '102', floor: 1, type: 'Suite', status: 'occupied', price: 5000, guest: 'Michael Smith', booking_id: 'bk_6602' },
            { id: '3', number: '103', floor: 1, type: 'Luxury', status: 'cleaning', price: 8000, guest: null },
            { id: '4', number: '104', floor: 1, type: 'Double', status: 'available', price: 4000, guest: null },
            { id: '5', number: '204', floor: 2, type: 'Deluxe', status: 'occupied', price: 4500, guest: 'Jane Doe', booking_id: 'bk_5521' },
            { id: '6', number: '301', floor: 3, type: 'Presidential', status: 'maintenance', price: 12000, guest: null }
        ];
        renderBoard(roomsData);
    }
}

function renderBoard(rooms) {
    if (rooms.length === 0) {
        AppStates.renderEmpty(grid, {
            icon: 'fa-door-closed',
            title: 'No Rooms Found',
            message: 'No rooms match your filter criteria.'
        });
        return;
    }

    grid.innerHTML = rooms.map(room => {
        const st = (room.status || 'available').toLowerCase();
        let statusClass = `status-${st}`;
        let statusLabel = st.toUpperCase();
        let actionBtn = '';

        if (st === 'available') {
            statusLabel = 'Available';
            actionBtn = `<button type="button" class="btn btn-gold" onclick="event.stopPropagation(); quickCheckin('${room.number}')" style="font-size: 12px; padding: 8px 12px; width: 100%;"><i class="fas fa-key me-1"></i> Check-in</button>`;
        } else if (st === 'occupied') {
            statusLabel = 'Occupied';
            actionBtn = `<button type="button" class="btn btn-danger" onclick="event.stopPropagation(); quickCheckout('${room.booking_id || room.number}')" style="font-size: 12px; padding: 8px 12px; width: 100%;"><i class="fas fa-sign-out-alt me-1"></i> Check-out</button>`;
        } else if (st === 'cleaning' || st === 'dirty') {
            statusLabel = 'Needs Cleaning';
            actionBtn = `<button type="button" class="btn btn-secondary-glass" onclick="event.stopPropagation(); markClean('${room.id || room.number}')" style="font-size: 12px; padding: 8px 12px; width: 100%; border-color: #fbbc05; color: #fbbc05;"><i class="fas fa-broom me-1"></i> Mark Clean</button>`;
        } else {
            statusLabel = 'Blocked';
            actionBtn = `<button type="button" class="btn btn-secondary-glass" disabled style="font-size: 12px; padding: 8px 12px; width: 100%; opacity: 0.6;"><i class="fas fa-tools me-1"></i> Maintenance</button>`;
        }

        return `
            <div class="room-card-status ${statusClass}" onclick="openRoomDrawer('${room.number}')">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px; font-weight: 600;">Floor ${room.floor || 1}</span>
                        <h2 style="font-size: 26px; color: var(--text-bright); margin: 2px 0 0; font-family: 'Cinzel', serif; font-weight: 700;">#${room.number}</h2>
                    </div>
                    <span class="badge rounded-pill" style="font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.1); color: var(--text-bright); border: 1px solid rgba(255,255,255,0.15); padding: 5px 10px;">${statusLabel}</span>
                </div>

                <div style="font-size: 13px; color: var(--text-primary); margin-bottom: 16px; min-height: 42px;">
                    <div style="font-weight: 600; color: #fff9e6;">${room.type || 'Standard'} Room</div>
                    ${room.guest ? `<div style="color: var(--primary-color); font-weight: 600; font-size: 12px; margin-top: 5px;"><i class="fas fa-user-circle me-1"></i> ${room.guest}</div>` : `<div style="font-size: 12px; color: var(--text-secondary); margin-top: 5px;"><i class="fas fa-check-circle me-1" style="color: #34a853; font-size: 11px;"></i> Vacant & Ready</div>`}
                </div>

                ${actionBtn}
            </div>
        `;
    }).join('');
}

// Side-drawer opener per Section D.2
window.openRoomDrawer = (roomNumber) => {
    const room = roomsData.find(r => String(r.number) === String(roomNumber));
    if (!room) return;

    drawerContent.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 14px; margin-bottom: 20px;">
            <div>
                <span style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase;">Room Inspection Drawer</span>
                <h2 style="color: var(--text-bright); font-size: 24px; margin: 2px 0 0;">Room ${room.number}</h2>
            </div>
            <button type="button" onclick="closeDrawer()" style="background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer;">&times;</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px; font-size: 13px;">
            <div style="background: rgba(0,0,0,0.3); padding: 14px; border-radius: 8px;">
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">Current Status</div>
                <div style="font-size: 16px; font-weight: bold; color: var(--primary-color); text-transform: uppercase; margin-top: 4px;">
                    ${room.status}
                </div>
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 14px; border-radius: 8px;">
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">Active Occupant / Reservation</div>
                <div style="font-size: 15px; color: var(--text-bright); font-weight: 600; margin-top: 4px;">
                    ${room.guest || 'None (Room currently vacant)'}
                </div>
                ${room.booking_id ? `<div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Booking: ${room.booking_id}</div>` : ''}
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 14px; border-radius: 8px;">
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">Specifications</div>
                <div style="color: var(--text-primary); margin-top: 4px;">Type: ${room.type || 'Deluxe'}</div>
                <div style="color: var(--text-primary);">Base Rate: ₹${room.price || 3500} / night</div>
                <div style="color: var(--text-primary);">Floor: ${room.floor || 1}</div>
            </div>
        </div>

        <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 10px;">
            ${room.status === 'available' ? `
                <button type="button" class="btn btn-primary" onclick="quickCheckin('${room.number}')">Proceed to Check-in</button>
            ` : room.status === 'occupied' ? `
                <button type="button" class="btn btn-danger" onclick="quickCheckout('${room.booking_id || room.number}')">Execute Check-out</button>
            ` : room.status === 'cleaning' ? `
                <button type="button" class="btn btn-secondary" onclick="markClean('${room.id || room.number}')" style="border-color: #fbbc05; color: #fbbc05;">Mark Clean (Available)</button>
            ` : ''}
            <button type="button" class="btn btn-secondary" onclick="closeDrawer()">Close Drawer</button>
        </div>
    `;

    drawerOverlay.classList.add('active');
};

window.closeDrawer = () => {
    drawerOverlay.classList.remove('active');
};

window.quickCheckin = (roomNum) => {
    window.location.href = `/staff/front-desk?checkin_room=${roomNum}`;
};

window.quickCheckout = async (bookingOrRoom) => {
    if (!confirm(`Execute checkout for Room/Booking ${bookingOrRoom}?`)) return;
    try {
        const res = await AppAPI.post('/api/front-desk/checkout', { booking_id: bookingOrRoom });
        Toast.success(`Checked out! Auto-created housekeeping clean task #${res.housekeeping_task_id}`);
        closeDrawer();
        loadRooms();
    } catch (e) {
        Toast.error(e.message || 'Checkout failed');
    }
};

window.markClean = async (roomId) => {
    try {
        await AppAPI.post('/api/front-desk/mark-clean', { room_id: roomId });
        Toast.success(`Room marked clean and now available!`);
        closeDrawer();
        loadRooms();
    } catch (e) {
        Toast.error('Failed to mark clean');
    }
};

document.addEventListener('DOMContentLoaded', () => {
    loadRooms();

    // Filters
    document.querySelectorAll('#statusFilterPills .filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            document.querySelectorAll('#statusFilterPills .filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            const st = pill.dataset.status;
            if (st === 'all') renderBoard(roomsData);
            else renderBoard(roomsData.filter(r => r.status === st));
        });
    });

    document.getElementById('floorSelector').addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'all') renderBoard(roomsData);
        else renderBoard(roomsData.filter(r => String(r.floor) === String(val)));
    });

    drawerOverlay.addEventListener('click', (e) => {
        if (e.target === drawerOverlay) closeDrawer();
    });
});
</script>
{% endblock %}
