{% extends "base.html" %}

{% block title %}Your Cart — Nur-e-Haya Hotel Management System{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 1280px;">
    <div class="screen-topbar d-flex justify-content-between align-items-center mb-4">
        <div class="topbar-title d-flex align-items-center gap-2" style="font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #fff9e6;">
            <i class="fas fa-shopping-cart text-warning"></i> Your Reservation Cart
        </div>
        <div class="topbar-actions d-flex gap-2">
            <a href="/rooms" class="btn btn-secondary-glass" style="font-size: 0.82rem; padding: 8px 16px;">
                <i class="fas fa-plus me-1"></i> Add Rooms
            </a>
            <a href="/menu" class="btn btn-secondary-glass" style="font-size: 0.82rem; padding: 8px 16px;">
                <i class="fas fa-utensils me-1"></i> Add Dining
            </a>
        </div>
    </div>

    <!-- Cart Container (Table or Empty state per Section C.3) -->
    <div id="cartContentArea" style="margin-top: 15px;">
        <!-- Injected via JS -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const area = document.getElementById('cartContentArea');

    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('nurehaya_cart') || '[]');

        if (!cart || cart.length === 0) {
            // Section C.3 Empty state: "Your cart is empty" + "Browse rooms" button
            AppStates.renderEmpty(area, {
                icon: 'fa-shopping-cart',
                title: 'Your cart is empty',
                message: 'You have not added any rooms, facility slots, or dining items yet.',
                actionText: 'Browse rooms',
                onAction: () => { window.location.href = '/rooms'; }
            });
            return;
        }

        let subtotal = 0;
        const rowsHtml = cart.map((item, idx) => {
            const qty = item.qty || 1;
            const lineTotal = (item.unit_price || 0) * qty;
            subtotal += lineTotal;

            let details = '';
            let typeBadge = '';
            if (item.type === 'room') {
                typeBadge = '<span style="background: rgba(212,175,55,0.15); color: var(--primary-color); border: 1px solid rgba(212,175,55,0.3); padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">Room</span>';
                details = `Dates: ${item.check_in || 'N/A'} to ${item.check_out || 'N/A'}`;
            } else if (item.type === 'facility') {
                typeBadge = '<span style="background: rgba(66,133,244,0.18); color: #8ab4f8; border: 1px solid rgba(66,133,244,0.3); padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">Facility</span>';
                details = `Date: ${item.date || 'Today'} | Slot: ${item.slot || 'Standard'}`;
            } else if (item.type === 'menu') {
                typeBadge = '<span style="background: rgba(46,229,157,0.18); color: #2ee59d; border: 1px solid rgba(46,229,157,0.3); padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">Dining</span>';
                details = `Qty: ${qty}`;
            }

            return `
                <tr>
                    <td style="padding: 16px 20px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <strong style="color: var(--text-bright); font-size: 14px;">${item.name}</strong>
                                    ${typeBadge}
                                </div>
                                <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">${details}</div>
                            </div>
                        </div>
                    </td>
                    <td style="color: var(--text-secondary); font-size: 13px; padding: 16px 20px;">
                        ${item.type === 'menu' ? `
                            <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(11,19,32,0.6); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(212,175,55,0.2);">
                                <button type="button" class="filter-pill" onclick="adjustCartQty(${idx}, -1)" style="padding: 2px 8px; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px;">-</button>
                                <strong style="color: #fff9e6;">${qty}</strong>
                                <button type="button" class="filter-pill" onclick="adjustCartQty(${idx}, 1)" style="padding: 2px 8px; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px;">+</button>
                            </div>
                        ` : `<span>1</span>`}
                    </td>
                    <td style="color: var(--primary-color); font-weight: 700; font-family: 'Cinzel', serif; padding: 16px 20px;">₹${item.unit_price}</td>
                    <td style="color: var(--text-bright); font-weight: 700; font-family: 'Cinzel', serif; font-size: 15px; padding: 16px 20px;">₹${lineTotal}</td>
                    <td style="text-align: right; padding: 16px 20px;">
                        <button type="button" onclick="removeFromCart(${idx})" class="btn btn-sm btn-outline-danger rounded-circle p-2" title="Remove" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;">
                            <i class="fas fa-trash-alt" style="font-size: 11px;"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');

        const estTax = Math.round(subtotal * 0.05);
        const estService = Math.round(subtotal * 0.025);
        const estTotal = subtotal + estTax + estService;

        area.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 360px; gap: 28px;" class="cart-layout-grid">
                <div class="screen-content nh-card" style="background: var(--card-gradient); border: 1px solid var(--border); border-top: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--card-shadow); overflow: hidden;">
                    <table class="app-table w-100" style="margin: 0;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border-subtle); background: rgba(11,19,32,0.4);">
                                <th style="padding: 14px 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);">Item & Details</th>
                                <th style="padding: 14px 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);">Qty / Duration</th>
                                <th style="padding: 14px 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);">Unit Price</th>
                                <th style="padding: 14px 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);">Total</th>
                                <th style="padding: 14px 20px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>

                <!-- Order Summary Card -->
                <div class="nh-card p-4" style="height: fit-content; background: var(--card-gradient); border: 1px solid var(--border); border-top: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--card-shadow);">
                    <h3 style="font-size: 1.25rem; color: var(--text-bright); margin-bottom: 16px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; font-family: 'Cinzel', serif;">
                        Estimated Summary
                    </h3>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--text-primary); margin-bottom: 10px;">
                        <span>Subtotal:</span>
                        <strong>₹${subtotal}</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;">
                        <span>GST (5%):</span>
                        <span>₹${estTax}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">
                        <span>Service Charge (2.5%):</span>
                        <span>₹${estService}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.35rem; color: var(--primary-color); font-weight: 800; font-family: 'Cinzel', serif; border-top: 1px solid var(--border-subtle); padding-top: 14px; margin-bottom: 24px;">
                        <span>Estimated Total:</span>
                        <span>₹${estTotal}</span>
                    </div>

                    <a href="/checkout" class="btn btn-gold w-100 text-center py-3" style="font-size: 14px; letter-spacing: 0.8px; font-weight: 700;">
                        PROCEED TO CHECKOUT <i class="fas fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        `;
    }

    window.adjustCartQty = (idx, delta) => {
        const cart = JSON.parse(localStorage.getItem('nurehaya_cart') || '[]');
        if (cart[idx]) {
            cart[idx].qty = Math.max(1, (cart[idx].qty || 1) + delta);
            localStorage.setItem('nurehaya_cart', JSON.stringify(cart));
            renderCart();
        }
    };

    window.removeFromCart = (idx) => {
        const cart = JSON.parse(localStorage.getItem('nurehaya_cart') || '[]');
        cart.splice(idx, 1);
        localStorage.setItem('nurehaya_cart', JSON.stringify(cart));
        Toast.info('Item removed from cart');
        renderCart();
    };

    renderCart();
});
</script>
{% endblock %}
