{% extends "base.html" %}

{% block title %}Sign in — Nur-e-Haya Hotel Management System{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    /* Centered card, 400px wide per Section B.2 */
    .login-card {
        width: 100%;
        max-width: 400px;
        background: var(--glass-bg, rgba(22, 34, 54, 0.85));
        border: var(--glass-border, 1px solid rgba(212, 175, 55, 0.25));
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.15);
        border-radius: 14px;
        padding: 36px 32px;
        backdrop-filter: blur(25px);
        position: relative;
    }

    .login-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .login-logo {
        font-family: 'Cinzel', serif;
        font-size: 28px;
        font-weight: 800;
        color: var(--primary-color, #d4af37);
        text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
    }

    .login-heading {
        font-family: 'Cinzel', serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-bright, #fff9e6);
        margin: 0;
    }

    .password-wrapper {
        position: relative;
    }

    .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary, #bda568);
        cursor: pointer;
        padding: 4px;
        font-size: 14px;
    }

    .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        font-size: 13px;
    }

    .remember-me-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-primary, #e8dfc1);
        cursor: pointer;
        user-select: none;
    }

    .forgot-link {
        color: var(--primary-color, #d4af37);
        text-decoration: none;
        transition: color 0.2s;
    }

    .forgot-link:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    .auth-divider {
        display: flex;
        align-items: center;
        margin: 24px 0;
        color: var(--text-secondary, #bda568);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .auth-divider::before,
    .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(212, 175, 55, 0.2);
    }

    .auth-divider span {
        padding: 0 12px;
    }

    .signup-prompt {
        text-align: center;
        margin-top: 22px;
        font-size: 13px;
        color: var(--text-secondary, #bda568);
    }

    .signup-prompt a {
        color: var(--primary-color, #d4af37);
        font-weight: 600;
        text-decoration: none;
    }

    .signup-prompt a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="login-card">
        <!-- Logo & Heading -->
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-hotel"></i> Nur-e-Haya
            </div>
            <h2 class="login-heading">Sign in</h2>
        </div>

        <!-- Section B.2 Login Form -->
        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="form-group">
                <label class="form-label required" for="email">Email address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="you@example.com" 
                    required 
                    autofocus
                    autocomplete="email"
                >
                <div class="form-field-error" data-for="email"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label required" for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        required 
                        minlength="8"
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
                <div class="form-field-error" data-for="password"></div>
            </div>

            <!-- Remember me & Forgot Password -->
            <div class="login-options">
                <label class="remember-me-label" for="remember_me">
                    <input type="checkbox" id="remember_me" name="remember_me" value="true">
                    <span>Remember me</span>
                </label>
                <a href="/forgot-password" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Sign in button — full width -->
            <button type="submit" class="btn btn-primary" id="btnSignIn" style="width: 100%;">
                SIGN IN
            </button>
        </form>

        <!-- Divider "or" -->
        <div class="auth-divider">
            <span>or</span>
        </div>

        <!-- Continue with Google button -->
        <div id="g_id_onload"
             data-client_id="851707665415-ahf7difr035p39bn9cmi948tvngpol2f.apps.googleusercontent.com"
             data-callback="handleGoogleSignIn"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="filled_black"
             data-text="continue_with"
             data-shape="rectangular"
             data-logo_alignment="left"
             data-width="336">
        </div>

        <!-- Don't have an account? Sign up (hidden if role query param indicates staff-only context) -->
        <div class="signup-prompt" id="signupPrompt">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    
    // Hide signup prompt if staff context per Section B.2
    if (roleParam && roleParam.toLowerCase() === 'staff') {
        const prompt = document.getElementById('signupPrompt');
        if (prompt) prompt.style.display = 'none';
    }

    // Password show/hide toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    }

    // Bind form using AppForm helper from Section A
    const loginForm = document.getElementById('loginForm');
    AppForm.bind(loginForm, {
        onSubmit: async (data, form) => {
            try {
                const result = await AppAPI.post('/api/auth/login', {
                    email: data.email,
                    password: data.password,
                    remember_me: data.remember_me === 'true' || data.remember_me === true
                });

                Toast.success('Sign in successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = result.redirect || '/dashboard';
                }, 600);
            } catch (err) {
                // If 429 rate limit or invalid credentials, Toast shows message per Section B.2
                if (err.status === 429) {
                    Toast.error(err.message || 'Too many attempts. Please try again later.');
                } else if (err.status === 401) {
                    Toast.error(err.message || 'Invalid email or password.');
                } else {
                    Toast.error(err.message || 'Sign in failed. Please try again.');
                }
            }
        }
    });
});

// Google sign in callback
function handleGoogleSignIn(response) {
    try {
        const payload = decodeJwtResponse(response.credential);
        AppAPI.post('/api/google-auth', {
            email: payload.email,
            name: payload.name,
            googleId: payload.sub
        }).then(data => {
            Toast.success('Google sign-in successful! Redirecting...');
            const redirectUrl = (data && data.redirect) ? data.redirect : '/dashboard';
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 500);
        }).catch(err => {
            Toast.error(err.message || 'Google sign-in failed.');
        });
    } catch (e) {
        Toast.error('Could not process Google Sign-In.');
    }
}

function decodeJwtResponse(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(jsonPayload);
}
</script>
{% endblock %}
