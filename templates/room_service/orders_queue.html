{% extends "base.html" %}

{% block title %}Room Service Orders — Nur-e-Haya Luxury Hotel{% endblock %}

{% block content %}
<div class="screen-shell" style="max-width: 1400px; margin: 0 auto; padding-top: 20px;">
    <!-- Topbar per Section A.2 / G.1 -->
    <div class="screen-topbar">
        <div class="topbar-title">
            <i class="fas fa-concierge-bell text-warning"></i>
            <span>Room Service: Incoming Orders</span>
            <span class="badge bg-warning text-dark rounded-pill ms-2" id="totalActiveOrders" style="font-size: 12px; font-family: 'Raleway', sans-serif;">0 Active</span>
        </div>
        <div class="topbar-actions">
            <button type="button" class="btn btn-secondary" onclick="fetchOrders()" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-sync-alt me-1"></i> Refresh
            </button>
            <a href="/staff/kitchen" class="btn btn-secondary" style="font-size: 13px; padding: 8px 16px;">
                <i class="fas fa-utensils me-1"></i> Kitchen KDS
            </a>
        </div>
    </div>

    <!-- Filterbar per Section A.2 -->
    <div class="screen-filterbar">
        <span style="font-size: 13px; color: var(--text-secondary); font-family: 'Cinzel', serif;">Filter Status:</span>
        <div class="filter-pills">
            <button type="button" class="filter-pill active" data-filter="all" onclick="setFilter('all', this)">All Orders</button>
            <button type="button" class="filter-pill" data-filter="received" onclick="setFilter('received', this)">Received</button>
            <button type="button" class="filter-pill" data-filter="preparing" onclick="setFilter('preparing', this)">Preparing</button>
            <button type="button" class="filter-pill" data-filter="ready" onclick="setFilter('ready', this)">Ready</button>
            <button type="button" class="filter-pill" data-filter="delivering" onclick="setFilter('delivering', this)">Delivering</button>
            <button type="button" class="filter-pill" data-filter="delivered" onclick="setFilter('delivered', this)">Delivered</button>
        </div>
        <div class="ms-auto d-none d-md-block" style="font-size: 12px; color: var(--text-secondary);">
            <i class="fas fa-shield-alt text-warning me-1"></i> High-value orders trigger mandatory delivery OTP
        </div>
    </div>

    <!-- Orders Grid Area -->
    <div class="row g-3 mt-1" id="ordersGrid"></div>
</div>

<style>
.order-card {
    background: rgba(22, 34, 54, 0.75);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    height: 100%;
}
.order-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary-color);
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
}
</style>

{% block extra_js %}
<script>
let allOrders = [];
let currentFilter = 'all';

async function fetchOrders() {
    const grid = document.getElementById('ordersGrid');
    if (window.AppConventions && AppConventions.AppStates) {
        AppConventions.AppStates.renderLoading(grid, { count: 3, type: 'card' });
    }

    try {
        const res = await fetch('/api/orders');
        const json = await res.json();
        if (json.ok && Array.isArray(json.data) && json.data.length > 0) {
            allOrders = json.data;
        } else {
            // Seed realistic demo orders
            allOrders = [
                {
                    order_id: 'ord_771',
                    room_number: '204',
                    guest_name: 'Eleanor Vance',
                    items: [
                        { name: 'Royal Dum Biryani Bowl', qty: 2, price: 450 },
                        { name: 'Cold Brew Specialty Coffee', qty: 2, price: 180 }
                    ],
                    total: 1260,
                    status: 'delivering',
                    require_otp: true,
                    otp: '119284',
                    delivery_notes: 'Ring bell gently, evening meal.',
                    created_at: '2026-09-13T19:40:00Z'
                },
                {
                    order_id: 'ord_772',
                    room_number: '305',
                    guest_name: 'James Bond',
                    items: [
                        { name: 'Club Sandwich & Truffle Fries', qty: 1, price: 320 }
                    ],
                    total: 320,
                    status: 'preparing',
                    require_otp: false,
                    delivery_notes: 'Extra mustard and napkins please.',
                    created_at: '2026-09-13T19:50:00Z'
                },
                {
                    order_id: 'ord_773',
                    room_number: '102',
                    guest_name: 'Sophia Loren',
                    items: [
                        { name: 'Imported Cheese & Fruit Platter', qty: 1, price: 650 },
                        { name: 'Sparkling Mineral Water', qty: 2, price: 120 }
                    ],
                    total: 890,
                    status: 'ready',
                    require_otp: false,
                    delivery_notes: 'Deliver immediately upon preparation.',
                    created_at: '2026-09-13T19:30:00Z'
                }
            ];
        }
        renderOrders();
    } catch (e) {
        console.error(e);
        if (window.AppConventions && AppConventions.Toast) AppConventions.Toast.error('Failed to load room service orders');
    }
}

function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-pills .filter-pill').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderOrders();
}

function renderOrders() {
    const grid = document.getElementById('ordersGrid');
    grid.innerHTML = '';

    const filtered = currentFilter === 'all' 
        ? allOrders 
        : allOrders.filter(o => (o.status || 'received').toLowerCase() === currentFilter.toLowerCase());

    const activeCount = allOrders.filter(o => o.status !== 'delivered').length;
    document.getElementById('totalActiveOrders').textContent = `${activeCount} Active`;

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="col-12">
                <div class="ui-empty-state">
                    <div class="ui-empty-icon"><i class="fas fa-utensils"></i></div>
                    <div class="ui-empty-title">No Orders in "${currentFilter.toUpperCase()}"</div>
                    <div class="ui-empty-message">Incoming meal and beverage tickets will show here.</div>
                </div>
            </div>
        `;
        return;
    }

    filtered.forEach(order => {
        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-xl-4';

        let badgeStatus = '';
        if (order.status === 'delivered') badgeStatus = '<span class="badge bg-success text-white rounded-pill px-2 py-1">Delivered</span>';
        else if (order.status === 'delivering') badgeStatus = '<span class="badge bg-primary text-white rounded-pill px-2 py-1"><i class="fas fa-walking me-1"></i>Delivering</span>';
        else if (order.status === 'ready') badgeStatus = '<span class="badge bg-warning text-dark rounded-pill px-2 py-1"><i class="fas fa-bell me-1"></i>Ready</span>';
        else if (order.status === 'preparing') badgeStatus = '<span class="badge bg-info text-dark rounded-pill px-2 py-1"><i class="fas fa-fire me-1"></i>Preparing</span>';
        else badgeStatus = '<span class="badge bg-secondary text-white rounded-pill px-2 py-1">Received</span>';

        const itemsListHtml = (order.items || []).map(i => `
            <div class="d-flex justify-content-between align-items-center py-1" style="font-size: 13px; color: var(--text-primary);">
                <span>${i.qty}x ${i.name}</span>
                <span class="fw-bold">₹${i.price * i.qty}</span>
            </div>
        `).join('');

        col.innerHTML = `
            <div class="order-card">
                <div class="d-flex justify-content-between align-items-start mb-3 pb-2 border-bottom" style="border-color: rgba(212,175,55,0.2) !important;">
                    <div>
                        <span class="badge bg-warning text-dark fw-bold px-2 py-1 rounded me-1" style="font-size: 12px;">Room ${order.room_number || '204'}</span>
                        <h6 class="fw-bold m-0 mt-1" style="color: var(--text-bright);">${order.guest_name || 'Guest'}</h6>
                    </div>
                    <div class="text-end">
                        ${badgeStatus}
                        <div class="small mt-1" style="color: var(--text-secondary); font-size: 11px;">#${order.order_id}</div>
                    </div>
                </div>

                <div class="flex-grow-1 mb-3">
                    <div class="mb-2">${itemsListHtml}</div>
                    ${order.delivery_notes ? `
                        <div class="p-2 rounded mt-2" style="background: rgba(15,26,42,0.8); border: 1px dashed rgba(212,175,55,0.2); font-size: 12px; color: var(--text-secondary);">
                            <i class="fas fa-comment-dots text-warning me-1"></i> ${order.delivery_notes}
                        </div>
                    ` : ''}
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2 border-top" style="border-color: rgba(255,255,255,0.08) !important;">
                    <div>
                        <span style="font-size: 11px; color: var(--text-secondary);">Total</span>
                        <div class="fw-bold" style="color: var(--primary-color); font-size: 16px;">₹${order.total || 0}</div>
                    </div>
                    <div class="d-flex gap-2">
                        ${order.require_otp ? '<span class="badge bg-danger text-white d-flex align-items-center" title="Requires Guest OTP"><i class="fas fa-shield-alt"></i></span>' : ''}
                        <a href="/staff/room-service/orders/${order.order_id}" class="btn btn-sm btn-primary" style="font-size: 12px; padding: 6px 14px;">
                            Manage <i class="fas fa-chevron-right ms-1" style="font-size: 10px;"></i>
                        </a>
                    </div>
                </div>
            </div>
        `;
        grid.appendChild(col);
    });
}

document.addEventListener('DOMContentLoaded', fetchOrders);
</script>
{% endblock %}
{% endblock %}
