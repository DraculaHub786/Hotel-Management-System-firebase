services:
  - type: web
    name: hotel-management-system
    env: python
    runtime: python-3.11.0
    plan: free
    
    # Build command
    buildCommand: pip install -r requirements.txt
    
    # Start command
    startCommand: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python gunicorn -w 4 -k gthread app:app
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        scope: secret
      - key: FIREBASE_CREDENTIALS_BASE64
        scope: secret
      - key: ALLOWED_ORIGINS
        value: https://nur-e-haya.onrender.com,http://localhost:5000
    
    # Health check
    healthCheckPath: /api/health

# Note: Set environment variables securely via Render Dashboard:
# - Add FIREBASE_CREDENTIALS_BASE64 (base64 encoded firebase service account key)
# - Add SECRET_KEY (cryptographic session key)
